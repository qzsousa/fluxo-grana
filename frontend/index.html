<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FluxoGrana — controle de contas, cartões, faturas, investimentos e metas" />
    <meta name="theme-color" content="#f6f5f1" />
    <title>FluxoGrana — Controle Financeiro Inteligente</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Aplica tema, acento, densidade e escala de texto ANTES da renderização
      // para não piscar o visual padrão em quem já escolheu outra coisa.
      (function () {
        var root = document.documentElement;
        try {
          var pref = localStorage.getItem("theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.setAttribute("data-theme", dark ? "dark" : "light");

          var prefs = JSON.parse(localStorage.getItem("preferences") || "{}");
          root.setAttribute("data-accent", prefs.accent || "petroleo");
          root.setAttribute("data-density", prefs.density || "comfortable");
          root.setAttribute("data-font-scale", prefs.fontScale || "normal");
        } catch (e) {
          root.setAttribute("data-theme", "light");
          root.setAttribute("data-accent", "petroleo");
          root.setAttribute("data-density", "comfortable");
          root.setAttribute("data-font-scale", "normal");
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
